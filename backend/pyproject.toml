[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myelin"
version = "0.3.0"
description = "Neuroplasticity habit OS: a live wallpaper that plans your day and protects your streak."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ahraz Kibria" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlmodel>=0.0.16",
  "adhanpy>=1.0.3",
  "platformdirs>=4.0",
  "tzdata>=2024.1",
  "icalendar>=6.0",
  "recurring-ical-events>=3.0",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
desktop = [
  "pywebview>=5.0",
  "pystray>=0.19",
  "psutil>=6.0",
  "windows-toasts>=1.1; sys_platform == 'win32'",
]
build = ["pyinstaller>=6.0"]

[project.scripts]
myelin = "myelin.__main__:main"

[project.gui-scripts]
myelin-app = "myelin.desktop:main"

[tool.setuptools.packages.find]
include = ["myelin*"]

[tool.setuptools.package-data]
myelin = ["defaults/*.json", "sql_samples/*.sql", "sql_samples/*.json", "assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
